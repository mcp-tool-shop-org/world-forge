name: CI

# F-e2bd0af6: no paths filter. Branch protection on main requires
# build-and-test (22), build-and-test (24), and site-build (strict: true).
# A paths filter on the workflow `on:` block means a missed glob produces
# ZERO of those contexts, which blocks the PR rather than failing it — the
# same deadlock v4.6.0 paid for with dogfood/**. CI is ~3 min
# (timeout-minutes: 20); running it on every PR is cheaper than another
# glob-list hole. Spec-only PRs (e2e/**) still start this workflow
# (F-2ed74a5c).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # INF-B-006: cap wall time so a runaway test / infinite loop can't drain the
    # 6-hour GitHub default. Current green runs finish in ~3 min; 20 is a comfy
    # ceiling.
    timeout-minutes: 20
    strategy:
      # F-89b7a3da: GitHub's default fail-fast: true cancelled the other Node
      # leg mid-job, so if: always() never reached Coverage/Upload on the
      # sibling. INF-B-004's "authoritative record" for the other LTS line was
      # missing exactly when a version-specific failure is what you need it for.
      fail-fast: false
      matrix:
        # Supported LTS lines only: 22 = Maintenance LTS, 24 = Active LTS.
        # Node 20 "Iron" reached end-of-life 2026-04-30 and was dropped.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # F-059ff1b5: SHIP_GATE D. Shipping Hygiene checks off "Dependency
      # scanning runs in CI (npm audit in verify)". verify is still
      # build+test (package.json is out of this domain); this step is the
      # job that can actually go red. No continue-on-error — high/critical
      # advisories fail the required check. Org skips Dependabot.
      - name: Dependency audit
        run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      # F-1256813c class-fix (swept with F-2ed74a5c): typecheck:dogfood already
      # exists as an npm script; CI never invoked it. Same class as Playwright —
      # gate exists, no consequence. Node 24 only; tsc does not differ by Node.
      - name: Dogfood typecheck
        if: matrix.node-version == 24
        run: npm run typecheck:dogfood
      # DOCS-B-003: scripts/sync-version.mjs --check has always been able to fail
      # on a drifted version token, a stale "N tests" figure, or a packages/*
      # version that no longer matches root — and nothing ever ran it. The gate
      # existed and was not connected to any consequence, which is why four public
      # surfaces drifted to four DIFFERENT wrong values for the same fact. It
      # measures the real suite, so it runs as its own explicit step (never via
      # prebuild) and only on the Active LTS leg, since the answer cannot differ
      # by Node version.
      - name: Version + documented-count drift gate
        if: matrix.node-version == 24
        run: npm run check-version
      # F-c3504879: SHIP_GATE D checked off `npm pack --dry-run` includes
      # dist/ README.md LICENSE. No job ran pack. Node 24 only — tarball
      # contents do not differ by Node version.
      - name: Pack contents (SHIP_GATE D)
        if: matrix.node-version == 24
        run: node scripts/check-pack.mjs
      # INF-B-004: Coverage runs every matrix leg so artifacts are uploaded
      # unconditionally, not gated to a single Node version.
      # F-6a9332cf: id so Upload can tell skipped (tests already failed,
      # coverage/ never written) from ran-but-empty. success() || failure()
      # still collects an artifact on a red test leg; cancelled jobs skip.
      # F-e61d16bc: this is a second full vitest run, not a coverage-only
      # collector. A red required-check step must name the suite, not the
      # reporter — keep id: coverage for the skip-gated upload below.
      - name: Re-run suite with coverage
        id: coverage
        if: success() || failure()
        run: npx vitest run --coverage
      # INF-B-004: Upload coverage artifacts every run so failing runs on older
      # Node versions still yield debuggable artifacts. Vitest does not produce a
      # separate "test output" directory by default — only the coverage/ directory
      # is authoritative, so that's what we upload.
      # F-6a9332cf: do not treat a skipped Coverage as missing files — that
      # overwrites the test-failure Andon with 'No files were found'. Keep
      # if-no-files-found: error for the Coverage-ran-but-wrote-nothing case.
      - name: Upload coverage artifacts
        if: always() && steps.coverage.conclusion != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          # F-7c57e7b2: ignore let a coverage run that exited 0 without
          # writing coverage/ stay green and produce no artifact — a weaker
          # sibling of the removed Codecov continue-on-error. Missing
          # coverage/ now fails the required check.
          if-no-files-found: error
      # The Codecov upload step that used to follow was REMOVED in v4.6.0. It ran
      # with `continue-on-error: true` and `fail_ci_if_error: false` against a
      # `CODECOV_TOKEN` secret that does not exist on this repo, so it could never
      # succeed and could never say so — the public badge rendered "unknown". A
      # step that cannot work and cannot report that it isn't working is worse
      # than no step: it reads as coverage reporting to anyone scanning the
      # workflow. Coverage itself is unaffected and still runs on every leg; the
      # artifacts above are the authoritative record. To restore external
      # reporting, add the secret first, then re-add the step.

  # F-2ed74a5c: Playwright was in the paths filter; CI never ran test:e2e.
  # Node 24 only. reuseExistingServer is disabled by CI=true (harness owns
  # playwright.config.ts). No continue-on-error. Build is required because
  # the editor vite aliases point at export-unreal/export-godot dist/.
  # F-4a5efc2f: job id stays e2e (not a required check). Display name so the
  # Actions tab does not sit as the abbreviation 'e2e' next to required
  # build-and-test / site-build — do not add name: on those two jobs.
  e2e:
    name: Playwright editor smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        env:
          CI: true
        run: npm run test:e2e
      # F-5ff896af: coverage already uploads on always(); the browser gate
      # had only the job log. harness-owned playwright.config.ts still needs
      # trace: retain-on-failure / screenshot: only-on-failure so test-results/
      # is not empty; this job still uploads whatever Playwright wrote.
      # F-19a6c1a0: Checks pane was still Playwright's locator dump with a
      # zip nobody was pointed at. Annotate before upload; keep
      # if-no-files-found: ignore so a missing zip does not overwrite the
      # Playwright Andon with 'No files were found'.
      - name: Point operator at Playwright artifacts
        if: failure()
        run: |
          if [ -d playwright-report ] || [ -d test-results ]; then
            echo "::notice::Playwright failed — download the playwright-e2e artifact (HTML report + traces)."
          else
            echo "::warning::Playwright wrote no report/traces (install or config failed before the runner). Re-run locally with PWDEBUG=1; traces need harness retain-on-failure."
          fi
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-e2e
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # INF-B-010: Type-check and build the Starlight handbook.
  # Keeps handbook drift (e.g. stale Package Map) from landing silently.
  # Kept intentionally minimal — only Node 24, single job, ~30s runtime target.
  # Always runs: site-build is a required check on main (F-e2bd0af6).
  site-build:
    runs-on: ubuntu-latest
    # INF-B-006: same budget cap as build-and-test. Handbook build is ~30s today.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site deps
        working-directory: site
        run: npm ci
      # F-df8375e8: site/ has its own lockfile; root build-and-test audit
      # cannot see Astro/Starlight/Tailwind. No continue-on-error — high/
      # critical advisories fail this required check.
      - name: Dependency audit
        working-directory: site
        run: npm audit --audit-level=high
      - name: Build handbook
        working-directory: site
        run: npm run build
