# Release — publish the six @world-forge/* packages to npm via OIDC Trusted
# Publishing.
#
# This file is named `release.yml` to match the npm Trusted Publisher binding
# configured for these packages (npmjs.com -> @world-forge/<pkg> -> Settings ->
# Trusted Publishers -> mcp-tool-shop-org/world-forge, workflow `release.yml`).
# It supersedes the old token-based `.github/workflows/publish.yml`. Auth is OIDC
# — there is intentionally NO NODE_AUTH_TOKEN / NPM_TOKEN.
#
# Triggers on `release: published` (org GitHub-Actions rule: publish workflows run
# on release, never on push). Create the release with `gh release create vX.Y.Z`;
# this workflow then builds, tests, and publishes all six packages in dependency
# order with Sigstore provenance.
#
# Workflow standards compliance (see .claude/rules/workflow-standards.md):
#   PIN_PER_STEP (2)        — actions SHA-pinned; node + npm versions fixed.
#   ANDON_AUTHORITY (2)     — build/test/pack gates run BEFORE any publish; any
#                             failure halts the job (no continue-on-error,
#                             anywhere, including the per-package publish
#                             guard added for F-f4cbf9e9 — an "already
#                             published" existence check is a clean skip, but
#                             a REAL npm publish failure still fails the step
#                             and the job with npm's own exit code).
#   NAMED_COMPENSATORS (3)  — see table below; npm publish has a named undo
#                             for a bad version that's fully live, AND (new,
#                             F-f4cbf9e9) a retry-forward path via
#                             .github/actions/publish-if-missing for a
#                             release that's only PARTIALLY live — re-running
#                             this job now completes the remaining packages
#                             instead of failing on the ones already done.
#   DECOMPOSE_BY_SECRETS (2)— this file owns the release secret (irreversible
#                             publish); ci.yml owns per-PR verification; the
#                             per-package existence-check strategy lives in
#                             its own composite action (publish-if-missing)
#                             since it's the one piece here likely to change
#                             again independently of the release sequence.
#   UNCERTAINTY_GATED_HUMANS(2) — the human gate IS `gh release create` (a
#                             person decides to cut the release; CI does not
#                             auto-release on tag push).
#   EXTERNAL_VERIFIER (1)   — n/a to a publish step; CI lint/test in ci.yml.
#
# Compensators (irreversible actions — NO skip allowed):
#   | Action                       | Undo                                                        | Post-rollback state                              | Owner |
#   |------------------------------|-------------------------------------------------------------|--------------------------------------------------|-------|
#   | npm publish @world-forge/<p> | `npm deprecate @world-forge/<p>@<v> "broken — use <prev>"`   | version stays on registry, marked deprecated;    | Mike  |
#   | (per package, x6)            | (npm forbids unpublish after 72h / for depended-on pkgs);   | consumers pin <prev>; ship a fixed <v+1>.        |       |
#   |                              | then publish a fixed patch <v+1>.                           |                                                  |       |
#   | GitHub Release create        | `gh release delete <tag> --cleanup-tag`                     | release + tag removed from remote.               | Mike  |
#
#   Half-published release (F-f4cbf9e9 — e.g. packages 1-3 of 6 succeeded,
#   4 failed, 5-6 never ran): the fix makes the FORWARD path (re-run this
#   same job — plain re-dispatch, "Re-run failed jobs", or re-running via a
#   new workflow_dispatch-less trigger) safe and sufficient: each already-
#   published package is detected via `npm view` and skipped, only the
#   remaining packages actually publish. Recovery is "re-run the job," no
#   manual intervention or version bump required. If a package must NOT go
#   out at all (e.g. it was published in a broken state and packages 4-6
#   still need a fix first), fall back to the per-package deprecate row
#   above for the ones already live, patch the source, and cut a new
#   release — same as any other bad-publish recovery. Owner: Mike.

name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # F-f4cbf9e9: was `true`. `github.ref` for a `release` event is the tag
  # (e.g. refs/tags/v4.5.1), which is unique per release, so this group only
  # ever collides with ANOTHER run for the exact same tag — i.e. someone
  # manually re-triggering the same release while the first attempt is
  # still running. With `true`, that second trigger CANCELLED the in-flight
  # run mid-`npm publish`, producing the same half-published state as a
  # genuine failure, just from a cancellation instead of an error. `false`
  # queues the new run behind the in-flight one instead of killing it, so
  # the only way to get a half-published release is a real failure — which
  # the per-package publish-if-missing guard (see steps below) now makes
  # safely retriable anyway.
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm (OIDC trusted publisher)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read       # npm publish only; the GitHub Release is created separately
      id-token: write      # OIDC: npm trusted publishing + Sigstore provenance
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # F-8cdb6b66: v6.4.0 + registry-url wrote _authToken=${NODE_AUTH_TOKEN}
      # and exported a dummy NODE_AUTH_TOKEN, which short-circuits the OIDC
      # exchange (ENEEDAUTH) — npm/documentation#1960, setup-node#1440.
      # v7.0.0 dropped that dummy. Official trusted-publishing examples keep
      # registry-url and set package-manager-cache: false (a poisoned cache
      # can expose OIDC tokens); do not restore cache: npm on this job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Strip _authToken from npmrc so OIDC can exchange
        run: |
          # F-8cdb6b66: v7 no longer exports a dummy NODE_AUTH_TOKEN (do not
          # write an empty NODE_AUTH_TOKEN= to GITHUB_ENV — that recreates
          # "auth is configured" for some npm versions). Strip any leftover
          # _authToken line from .npmrc so a pin drift back to v6 cannot
          # short-circuit the OIDC exchange (ENEEDAUTH).
          unset NODE_AUTH_TOKEN
          for rc in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" .npmrc; do
            if [ -n "$rc" ] && [ -f "$rc" ]; then
              sed -i '/_authToken/d' "$rc"
            fi
          done

      - name: Install npm 11.6.2 in sandbox for OIDC trusted-publishing auth
        run: |
          # Node 22 bundles npm 10.x, which cannot do OIDC trusted publishing,
          # and an in-place `npm i -g npm@11.6.2` races its own arborist rebuild.
          # F-8cdb6b66: pin 11.6.2 (11.5+ required) — never npm@latest.
          SANDBOX="$HOME/.npm-cli-sandbox"
          mkdir -p "$SANDBOX"
          pushd "$SANDBOX" >/dev/null
          echo '{"name":"npm-cli-sandbox","version":"0.0.0","private":true}' > package.json
          npm install --no-save --no-audit --no-fund --silent npm@11.6.2
          popd >/dev/null
          echo "$SANDBOX/node_modules/.bin" >> "$GITHUB_PATH"
          SANDBOX_NPM="$SANDBOX/node_modules/.bin/npm"
          GOT="$("$SANDBOX_NPM" --version)"
          echo "sandbox npm ${GOT}"
          if [ "$GOT" != "11.6.2" ]; then
            echo "::error::pinned npm@11.6.2 but sandbox reports ${GOT}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # F-df8375e8: a tag that never rode a PR must still fail on high/
      # critical advisories before publish. No continue-on-error.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: ${GITHUB_REF_NAME} -> ${TAG_VERSION} | Package: ${PKG_VERSION}"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Release tag ${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # F-cefc8213: ci.yml's Node 24 required leg runs these as explicit
      # steps, never via prebuild. scripts/sync-version.mjs is a no-op write
      # under GITHUB_ACTIONS, so a drifted version token or a dogfood type
      # error that never rode a PR (gh release create on any tagged commit)
      # could not go red on the publish job. Playwright was mirrored as part
      # of F-2ed74a5c; these two newer CI gates were not.
      - name: Dogfood typecheck
        run: npm run typecheck:dogfood

      - name: Version + documented-count drift gate
        run: npm run check-version

      # F-2ed74a5c: same Playwright gate as ci.yml, before any publish.
      # reuseExistingServer is disabled by CI=true. No continue-on-error.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e
        env:
          CI: true
        run: npm run test:e2e

      # F-5ff896af: same hole as ci.yml e2e — on failure the only
      # observability was the job log. Upload even if harness has not yet
      # enabled retain-on-failure traces (if-no-files-found: ignore).
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-e2e-release
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      # Publish in dependency order with Sigstore provenance (OIDC — NO token):
      #   1. schema (no deps)
      #   2. export-ai-rpg, export-unreal, export-godot, renderer-2d (depend on schema)
      #   3. editor (depends on all above)
      #
      # Each step delegates to ./.github/actions/publish-if-missing
      # (F-f4cbf9e9), which checks `npm view <name>@<version>` first and
      # skips the publish if that exact version is already live — so
      # re-running this job after a partial failure (or a cancelled
      # mid-sequence run) completes the remaining packages instead of
      # failing again on the ones already done. A real publish failure
      # still fails the step/job normally; see the action file for the
      # full reasoning and the wave-4 ci-tooling output for the exit-code
      # proof (skip path exits 0 without calling publish; real-error path
      # exits non-zero).
      - name: Publish @world-forge/schema
        uses: ./.github/actions/publish-if-missing
        with:
          working-directory: packages/schema

      - name: Publish @world-forge/export-ai-rpg
        uses: ./.github/actions/publish-if-missing
        with:
          working-directory: packages/export-ai-rpg

      - name: Publish @world-forge/export-unreal
        uses: ./.github/actions/publish-if-missing
        with:
          working-directory: packages/export-unreal

      - name: Publish @world-forge/export-godot
        uses: ./.github/actions/publish-if-missing
        with:
          working-directory: packages/export-godot

      - name: Publish @world-forge/renderer-2d
        uses: ./.github/actions/publish-if-missing
        with:
          working-directory: packages/renderer-2d

      - name: Publish @world-forge/editor
        uses: ./.github/actions/publish-if-missing
        with:
          working-directory: packages/editor
